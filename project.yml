name: Hovery
options:
  bundleIdPrefix: app.hovery
  deploymentTarget:
    macOS: "26.0"
packages:
  TOMLKit:
    url: https://github.com/LebJe/TOMLKit.git
    exactVersion: 0.6.0
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 38D7254X2P
targets:
  Hovery:
    type: application
    platform: macOS
    sources:
      - path: Hovery
        excludes:
          - Resources/Info.plist
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
    info:
      path: Hovery/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSHumanReadableCopyright: Copyright © 2026 waterlens
    dependencies:
      - package: TOMLKit
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.2.1
        PRODUCT_BUNDLE_IDENTIFIER: app.hovery.Hovery
        PRODUCT_NAME: Hovery
        INFOPLIST_KEY_CFBundleDisplayName: Hovery
    scheme:
      testTargets:
        - HoveryTests
  HoveryTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - HoveryTests
    dependencies:
      - target: Hovery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hovery.HoveryTests
        GENERATE_INFOPLIST_FILE: YES
