# The manifest's text is English. The page reads these messages from `extension.messages` and
# fills in `{placeholder}`s. URL, key, and model placeholders need no translation.

[en.messages]
copyOriginal = "Copy Original"
copyTranslation = "Copy Translation"
copied = "Copied"
copyFailed = "Couldn’t Copy"
translating = "Translating…"
# {settings} lists setupBaseURL and setupModel.
setupRequired = "Click the gear button above and enter the {settings} to start translating."
setupBaseURL = "Base URL"
setupModel = "Model"
translationFailed = "Couldn’t Translate"
# Failures, named by TranslationError code. A message from the service replaces them.
invalidBaseURL = "The Base URL is not a valid URL."
invalidBaseURLHint = "Enter a full URL, such as https://api.openai.com/v1."
unsupportedBaseURL = "The Base URL must start with https:// or http://."
timeout = "The service did not respond within {seconds} seconds."
timeoutHint = "Try again, or increase the timeout in Auto Translator’s settings."
network = "Could not connect to {origin}."
networkHint = "Check the Base URL and your network connection. The service must allow cross-origin requests (CORS)."
http = "The service responded with HTTP {status}."
unauthorizedHint = "Check the API key in Auto Translator’s settings."
notFoundHint = "Check the Base URL (it usually ends with a version path such as /v1) and the model name."
rateLimitedHint = "The service is limiting requests. Try again in a moment."
serverErrorHint = "The service had a problem. Try again later."
serviceError = "The service reported an error."
malformedStream = "The service sent a malformed streaming response."
unexpectedResponse = "The service returned an unexpected response."
emptyTranslation = "The service returned an empty translation."
unknown = "An unknown error occurred."

